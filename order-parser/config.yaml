# Настройки источников. Секреты (токены, ключи) — только в .env.
# Включение/выключение источников — флаги SOURCE_* в .env.

telegram:
  # Чаты и каналы, которые слушает userbot. Аккаунт должен состоять в них.
  # Можно указывать: @username, ссылку https://t.me/username или числовой id (-100...).
  chats: []
  #  - "@freelance_orders"
  #  - "https://t.me/some_channel"
  #  - -1001234567890

fl:
  # Пусто — общая лента https://www.fl.ru/rss/all.xml (последние 60 заказов всех категорий,
  # это несколько часов — при опросе раз в 3 минуты ничего не теряется). Отбор делают ключевые слова.
  # Можно сузить, перечислив группы (?category=N) и/или подкатегории (?subcategory=N):
  #   группы: 5 Программирование, 2 Сайты, 34 Мессенджеры, 31 AI, 36 Mobile, 41 Автоматизация бизнеса
  #   подкатегории: 279 Разработка чат-ботов, 280 Парсинг данных, 37 Веб-программирование (Программирование),
  #                 9 Веб-программирование (Сайты), 27 Сайт «под ключ», 8 Верстка, 86 CMS
  categories: []
  subcategories: []

kwork:
  # Категории биржи (параметр c=). 11 — весь раздел «Разработка и IT» одним запросом.
  # Подразделы: 37 Создание сайта, 38 Доработка и настройка сайта, 41 Скрипты, боты и mini apps,
  #             79 Верстка, 39 Мобильные приложения, 80 Десктоп, 255 Сервера и хостинг, 113 Базы данных и клиентов
  # "all" — все категории биржи.
  categories: [11]
  # Сколько страниц по 12 проектов читать в каждой категории (1 обычно достаточно).
  pages: 1

habr:
  # ВНИМАНИЕ: Habr Freelance закрыт 28.02.2025, источник выключен в .env (SOURCE_HABR=false).
  # Слаги категорий (если сайт оживёт): development_bots (Боты и парсинг данных), development_backend,
  # development_frontend, development_all_inclusive (Сайты «под ключ»), development_scripts. Пусто — все задачи.
  categories: []
  pages: 1

freelancer:
  # Поисковые запросы к API Freelancer.com (каждый — отдельный запрос за цикл).
  # Пусто — ищем по латинским словам из keywords.yaml (telegram bot, react, next.js, ...): заказы там
  # почти только на английском, и слова, добавленные через /add_kw, сразу попадают в поиск.
  # Поиск API работает «через ИЛИ», окончательный отбор всё равно делает keywords.yaml.
  queries: []
  # Сколько последних проектов брать по каждому запросу (до 100).
  limit: 30

filters:
  # Курс к рублю для сравнения с MIN_BUDGET из .env (иностранные бюджеты Freelancer.com и др.).
  # Указанные здесь значения дополняют встроенные.
  currency_rates:
    USD: 90
    EUR: 100
