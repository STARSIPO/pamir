# Ключевые слова для отбора заказов (регистр не важен, RU/EN).
# include — заказ подходит, если найдено хотя бы одно слово/фраза.
# exclude — стоп-слова: заказ отбрасывается, даже если include совпал.
# Слово ищется с начала слова: «бот» найдёт «бота», «чат-бот», но не «работа».
# Точное совпадение целого слова — слово в двойных кавычках, в YAML: - '"бот"'
# Файл можно править вручную или командами бота /add_kw, /del_kw.
include:
- telegram бот
- бот
- aiogram
- telegram bot
- mini app
- сайт
- лендинг
- веб-приложение
- next.js
- react
- vue
- nuxt
- fastapi
- nestjs
- парсер
- web app
exclude:
- ищу работу
- резюме
- вакансия в штат
- курс
- обучение
